server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        same-site: lax
        path: /

spring:
  datasource:
    url: ${DB_URL:jdbc:mariadb://127.0.0.1:3308/restock_db?characterEncoding=UTF-8}
    username: ${DB_USERNAME:restok}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}

  mvc:
    static-path-pattern: /uploads/**

  web:
    resources:
      static-locations: ${STATIC_FILE_LOCATION:file:./data/uploads/}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  database:
    charset-migration:
      enabled: ${DB_CHARSET_MIGRATION_ENABLED:false}
      lock-wait-seconds: ${DB_CHARSET_MIGRATION_LOCK_WAIT_SECONDS:10}

file:
  upload-dir: ${FILE_UPLOAD_DIR:./data/uploads/}

ai:
  service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
  google:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    com.ai.project: INFO
