services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: ${DB_NAME:-restok_db}
      MARIADB_USER: ${DB_USER:-restok}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai:
    build:
      context: ./ai_server
    restart: unless-stopped
    environment:
      AI_SECURE_TOKEN: ${AI_SECURE_TOKEN:?AI_SECURE_TOKEN is required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      ai:
        condition: service_started
    environment:
      DB_URL: jdbc:mariadb://mariadb:3306/${DB_NAME:-restok_db}?useUnicode=true&characterEncoding=UTF-8
      DB_USERNAME: ${DB_USER:-restok}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AI_SERVICE_URL: http://ai:8000
      AI_SECURE_TOKEN: ${AI_SECURE_TOKEN:?AI_SECURE_TOKEN is required}
      GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:18081}
    volumes:
      - upload_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${RESTOK_BIND_HOST:-127.0.0.1}:${RESTOK_FRONTEND_PORT:-18081}:80"

volumes:
  mariadb_data:
  upload_data:
