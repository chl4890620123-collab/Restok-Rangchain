services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-restock_db}
      MARIADB_USER: ${DB_USERNAME:-restok}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-3308}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-server:
    build:
      context: ./ai_server
    restart: unless-stopped
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      AI_MAX_IMAGE_BYTES: ${AI_MAX_IMAGE_BYTES:-10485760}
    ports:
      - "127.0.0.1:${AI_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      ai-server:
        condition: service_started
    environment:
      DB_URL: jdbc:mariadb://mariadb:3306/${DB_NAME:-restock_db}?characterEncoding=UTF-8
      DB_USERNAME: ${DB_USERNAME:-restok}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_SERVICE_BASE_URL: http://ai-server:8000
      FILE_UPLOAD_DIR: /app/data/uploads/
      STATIC_FILE_LOCATION: file:/app/data/uploads/
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost}
      JPA_SHOW_SQL: "false"
    volumes:
      - uploads:/app/data/uploads

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: ""
        REACT_APP_GOOGLE_OAUTH_ENABLED: ${REACT_APP_GOOGLE_OAUTH_ENABLED:-false}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  mariadb_data:
  uploads:
