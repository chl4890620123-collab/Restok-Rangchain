services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: ${DB_NAME:-restock_db}
      MARIADB_USER: ${DB_USER:-restok}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  ai:
    build:
      context: ./ai_server
    restart: unless-stopped
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      AI_MAX_IMAGE_BYTES: ${AI_MAX_IMAGE_BYTES:-10485760}

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      ai:
        condition: service_started
    environment:
      DB_URL: jdbc:mariadb://mariadb:3306/${DB_NAME:-restock_db}?useUnicode=true&characterEncoding=UTF-8
      DB_USERNAME: ${DB_USER:-restok}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_SERVICE_BASE_URL: http://ai:8000
      FILE_UPLOAD_DIR: /app/data/uploads/
      STATIC_FILE_LOCATION: file:/app/data/uploads/
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:18081}
      DB_CHARSET_MIGRATION_ENABLED: ${DB_CHARSET_MIGRATION_ENABLED:-false}
      JPA_SHOW_SQL: "false"
    volumes:
      - upload_data:/app/data/uploads

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: ""
        REACT_APP_GOOGLE_OAUTH_ENABLED: ${REACT_APP_GOOGLE_OAUTH_ENABLED:-false}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${RESTOK_BIND_HOST:-127.0.0.1}:${RESTOK_FRONTEND_PORT:-18081}:80"

volumes:
  mariadb_data:
  upload_data:
